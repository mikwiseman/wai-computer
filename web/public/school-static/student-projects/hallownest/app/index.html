function buildWallTex() {
    for (const s of solids) {
        s.bricks = [];
        const bw = 44, bh = 22;
        let row = 0;
        for (let by = s.y; by < s.y + s.h; by += bh) {
            const off = (row % 2) * (bw / 2) + (Math.random() * 6 - 3);
            for (let bx = s.x - bw + off; bx < s.x + s.w; bx += bw)
                s.bricks.push({ x: Math.max(s.x, bx), y: by });
            row++;
        }
        s.mossSpots = [];
        const mn = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < mn; i++)
            s.mossSpots.push({ x: s.x + 8 + Math.random() * Math.max(4, s.w - 16), r: 5 + Math.random() * 9 });
    }
}
function buildCracks() {
    for (const b of breakables) {
        b.cracks = [];
        let x = b.x + b.w * 0.5, y = b.y + 2, main = [[x, y]];
        while (y < b.y + b.h - 3) {
            x += (Math.random() * 2 - 1) * b.w * 0.3;
            x = Math.max(b.x + 4, Math.min(b.x + b.w - 4, x));
            y += 9 + Math.random() * 9;
            main.push([x, Math.min(y, b.y + b.h - 2)]);
        }
        b.cracks.push(main);
        for (let k = 0; k < 2; k++) {
            let bx = b.x + 8 + Math.random() * (b.w - 16), by = b.y + 12 + Math.random() * (b.h - 26), br = [[bx, by]];
            for (let s = 0; s < 3; s++) {
                bx += (Math.random() * 2 - 1) * 12;
                by += 7 + Math.random() * 9;
                br.push([bx, by]);
            }
            b.cracks.push(br);
        }
    }
}

let actx = null, musicGain = null, sfxGain = null, muted = false, audioOn = false;
function initAudio() {
    if (audioOn)
        return;
    audioOn = true;
    try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        sfxGain = actx.createGain();
        sfxGain.gain.value = 0.22;
        sfxGain.connect(actx.destination);
        musicGain = actx.createGain();
        musicGain.gain.value = muted ? 0 : 0.11;
        musicGain.connect(actx.destination);
        [55, 82.4].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = i ? 0.04 : 0.06; o.connect(g); g.connect(musicGain); o.start(); });
        const notes = [220, 261.6, 293.7, 329.6, 392];
        setInterval(() => {
            if (muted || !actx)
                return;
            const f = notes[Math.floor(Math.random() * notes.length)];
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.value = 0.0001;
            g.gain.exponentialRampToValueAtTime(0.03, actx.currentTime + 0.5);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 2.3);
            o.connect(g);
            g.connect(musicGain);
            o.start();
            o.stop(actx.currentTime + 2.4);
        }, 2800);
    }
    catch (e) { }
}
function beep(freq, dur, type, slideTo, vol) {
    if (!actx || muted)
        return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    if (slideTo)
        o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
    g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(vol || 0.5, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g);
    g.connect(sfxGain);
    o.start();
    o.stop(actx.currentTime + dur + 0.02);
}

    ctx.fillText(LEVELS[currentLevel].name + '  ·  ' + (currentLevel + 1) + '/' + LEVELS.length, W - 20, 26);
    ctx.textAlign = 'left';
    if (muted) {
        ctx.fillStyle = 'rgba(120,150,180,0.7)';
        ctx.font = '13px Georgia';
        ctx.fillText('🔇', W - 30, 46);
    }
    if (crumbleActive && state === 'play') {
        const blink = Math.floor(_t / 250) % 2 === 0;
        ctx.textAlign = 'center';
        ctx.fillStyle = blink ? '#ff6a4a' : '#ffb08a';
        ctx.font = 'bold 22px Georgia';
        ctx.fillText("⚠ FLOOR COLLAPSING — RUN RIGHT!", W / 2, 40);
        ctx.textAlign = 'left';
    }
}
function drawOverlay() {
    const tap = touchUI();
    const again = tap ? "Tap the screen to try again" : "Press R to try again";
    const next = tap ? "Tap the screen for the next hall →" : "Press R for the next hall →";
    const anew = tap ? "Tap the screen to play again" : "Press R to play again";
    if (state === 'dead') {
        ctx.fillStyle = 'rgba(20,4,8,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#e8b0b0';
        ctx.font = '40px Georgia';
        ctx.fillText("You fell", W / 2, H / 2 - 10);
        ctx.fillStyle = '#a06a6a';
        ctx.font = '16px Georgia';
        ctx.fillText("Darkness consumed the wanderer…", W / 2, H / 2 + 22);
        ctx.fillStyle = '#7ab8ff';
        ctx.font = '18px Georgia';
        ctx.fillText(again, W / 2, H / 2 + 62);
        ctx.textAlign = 'left';
    }
    else if (state === 'win') {
        const last = currentLevel === LEVELS.length - 1;
        ctx.fillStyle = 'rgba(6,14,26,0.62)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        if (!last) {
            ctx.fillStyle = '#d8eaf8';
            ctx.font = '36px Georgia';
            ctx.fillText("Hall cleared: " + LEVELS[currentLevel].name, W / 2, H / 2 - 20);
            ctx.fillStyle = '#8fd0ff';
            ctx.font = '18px Georgia';
            ctx.fillText("⟡ Sparks collected: " + sparkCount + " of " + sparks.length, W / 2, H / 2 + 14);
            ctx.fillStyle = '#6aaae0';
            ctx.font = '15px Georgia';
            ctx.fillText("The wanderer climbs higher…", W / 2, H / 2 + 44);
            ctx.fillStyle = '#7ab8ff';
            ctx.font = '18px Georgia';
            ctx.fillText(next, W / 2, H / 2 + 84);
        }
        else {
            ctx.fillStyle = '#d8eaf8';
            ctx.font = '38px Georgia';
            ctx.fillText("Castle conquered!", W / 2, H / 2 - 20);
            ctx.fillStyle = '#8fd0ff';
            ctx.font = '18px Georgia';
            ctx.fillText("⟡ Sparks in this hall: " + sparkCount + " of " + sparks.length, W / 2, H / 2 + 14);
            ctx.fillStyle = '#6aaae0';
            ctx.font = '15px Georgia';
            ctx.fillText("You cleared every hall in the castle.", W / 2, H / 2 + 44);
            ctx.fillStyle = '#7ab8ff';
            ctx.font = '18px Georgia';
            ctx.fillText(anew, W / 2, H / 2 + 84);
        }
        ctx.textAlign = 'left';
    }
}
const STEP = 1000 / 60;
let lastT = 0, acc = 0;
function loop(now) {
    if (now === undefined)
        now = performance.now();
    if (!lastT)
        lastT = now;
    let dt = now - lastT;
    lastT = now;
    if (dt > 250)
        dt = 250;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
        _t += STEP;
        update();
        acc -= STEP;
        steps++;
    }
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    drawSky();
    drawStars();
    const sx = cam.shake ? (Math.random() * 2 - 1) * cam.shake : 0;
    const sy = cam.shake ? (Math.random() * 2 - 1) * cam.shake : 0;
    drawClouds();
    drawFar();
    drawMid();
    ctx.save();
    ctx.translate(-cam.x + sx, -cam.y + sy);
    drawFireflies();
    drawRoots();
    drawDecor();
    drawRain();
    drawSolids();
    drawCrumble();
    drawFog();
    drawBreakables();
    drawCollapses();
    drawSpawn();
    drawSparks();
    drawGoal();
    drawHints();
    drawEnemies();
    drawParticles();
    drawDashTrail();
    const blink = hero.inv > 0 && Math.floor(hero.inv / 4) % 2 === 1;
    if (!blink)
        drawHero();
    ctx.restore();
    drawDust();
    drawVignette();
    drawHUD();
    drawOverlay();
    requestAnimationFrame(loop);
}
fitCanvas();
loadLevel(0);
loop();
window.Game = {
    hero, cam, keys, particles,
    get SPAWN() { return SPAWN; },
    get solids() { return solids; }, get breakables() { return breakables; }, get collapses() { return collapses; },
    get enemies() { return enemies; }, get sparks() { return sparks; }, get goal() { return goal; },
    step: update, respawnPlayer, restartAll, loadLevel, damage, die,
    getState: () => state, setState: (s) => { state = s; }, sparkCount: () => sparkCount,
    level: () => currentLevel, levelCount: LEVELS.length,
    get WORLD_W() { return WORLD_W; }, get WORLD_H() { return WORLD_H; },
    get W() { return W; }, get H() { return H; }, fit: fitCanvas
};
</script>
</body>
